<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motivate 3.0</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #0f0f1a;
  color: white;
}

/* HERO */
.hero {
  height: 50vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(270deg, #4facfe, #00f2fe, #7f00ff);
  background-size: 600% 600%;
  animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove {
  0% {background-position:0%}
  50% {background-position:100%}
  100% {background-position:0%}
}

/* SECTIONS */
.section {
  padding: 20px;
  text-align: center;
}

/* BUTTONS */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px,1fr));
  gap: 10px;
  max-width: 600px;
  margin: auto;
}

.btn {
  padding: 15px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
  cursor: pointer;
}

.btn.active {
  background: #00f2fe;
  color: black;
}

/* QUOTE */
.quote_box {
  margin: 20px auto;
  max-width: 600px;
  padding: 20px;
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
}

.quote {
  font-size: 1.4rem;
  opacity: 0;
  transform: translateY(10px);
  transition: 0.3s;
}

.quote.show {
  opacity: 1;
  transform: none;
}

/* STREAK */
.streak {
  margin-top: 10px;
  color: #00f2fe;
}
</style>
</head>

<body>

<div class="hero">
  <h1>Motivate</h1>
  <p>Control your mindset daily</p>
</div>

<div class="section">
  <h2>Mood</h2>
  <div class="grid" id="moods"></div>
</div>

<div class="section">
  <h2>Day</h2>
  <div class="grid" id="days"></div>
</div>

<div class="quote_box">
  <div class="quote" id="quote"></div>
  <div class="streak" id="streak"></div>
</div>

<script>

/* STATE */
const state = {
  mood: localStorage.getItem("mood"),
  day: localStorage.getItem("day"),
  streak: Number(localStorage.getItem("streak") || 0),
  lastVisit: localStorage.getItem("lastVisit")
};

/* DATA */
const moods = ["focus","calm","confidence"];

const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

const quotes = {
  focus: {
    Monday: "Start focused. Block distractions.",
    Tuesday: "Deep work beats shallow effort.",
    Wednesday: "Halfway — stay locked in.",
    Thursday: "Finish strong, no excuses.",
    Friday: "Discipline > motivation.",
    Saturday: "Sharpen your edge.",
    Sunday: "Prepare with intent."
  },
  calm: {
    Monday: "Breathe. You control the pace.",
    Tuesday: "Let go of unnecessary stress.",
    Wednesday: "Balance over chaos.",
    Thursday: "Stay centered.",
    Friday: "Relax — you made it.",
    Saturday: "Slow down.",
    Sunday: "Reset your mind."
  },
  confidence: {
    Monday: "Own the week.",
    Tuesday: "You are capable.",
    Wednesday: "You’ve handled worse.",
    Thursday: "Push your limits.",
    Friday: "You earned this.",
    Saturday: "Be bold.",
    Sunday: "Trust yourself."
  }
};

/* INIT UI */
const moodContainer = document.getElementById("moods");
const dayContainer = document.getElementById("days");

moods.forEach(m => {
  const btn = document.createElement("button");
  btn.className = "btn";
  btn.textContent = m;
  btn.onclick = () => setMood(m);
  moodContainer.appendChild(btn);
});

days.forEach(d => {
  const btn = document.createElement("button");
  btn.className = "btn";
  btn.textContent = d;
  btn.onclick = () => setDay(d);
  dayContainer.appendChild(btn);
});

/* FUNCTIONS */
function setMood(mood) {
  state.mood = mood;
  localStorage.setItem("mood", mood);
  render();
}

function setDay(day) {
  state.day = day;
  localStorage.setItem("day", day);
  render();
}

function updateStreak() {
  const today = new Date().toDateString();

  if (state.lastVisit !== today) {
    state.streak++;
    state.lastVisit = today;
    localStorage.setItem("streak", state.streak);
    localStorage.setItem("lastVisit", today);
  }
}

function render() {

  document.querySelectorAll("#moods .btn").forEach(btn => {
    btn.classList.toggle("active", btn.textContent === state.mood);
  });

  document.querySelectorAll("#days .btn").forEach(btn => {
    btn.classList.toggle("active", btn.textContent === state.day);
  });

  const quoteEl = document.getElementById("quote");

  if (state.mood && state.day) {
    quoteEl.classList.remove("show");
    setTimeout(() => {
      quoteEl.textContent = quotes[state.mood][state.day];
      quoteEl.classList.add("show");
    }, 100);
  }

  document.getElementById("streak").textContent =
    `🔥 Streak: ${state.streak} days`;
}

/* START */
updateStreak();
render();

</script>

</body>
</html>
