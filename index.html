<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motivate</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

button {
  padding: 10px 15px;
  margin: 5px;
  cursor: pointer;
}

.mood.active {
  background: cyan;
  color: black;
}

.cards {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 10px;
}

.card {
  min-width: 200px;
  background: #222;
  padding: 10px;
}
</style>
</head>

<body>

<h1>Motivate</h1>

<!-- MOODS -->
<div>
  <button class="mood" data-mood="focus">Focus</button>
  <button class="mood" data-mood="calm">Calm</button>
  <button class="mood" data-mood="confidence">Confidence</button>
</div>

<!-- DAYS -->
<div>
  <button class="day" data-day="Monday">Mon</button>
  <button class="day" data-day="Tuesday">Tue</button>
  <button class="day" data-day="Wednesday">Wed</button>
</div>

<!-- QUOTES -->
<p id="dailyQuote"></p>
<p id="dayQuote"></p>
<p id="streak"></p>

<!-- CARDS -->
<div class="cards" id="cards"></div>

<script>

/* DATA */
const content = {
  focus: ["Deep Work", "No Distractions"],
  calm: ["Relax", "Breathe"],
  confidence: ["Believe", "Win"]
};

const dailyQuotes = ["Push.", "Discipline.", "Consistency."];
const dayQuotes = {
  Monday: "Start strong",
  Tuesday: "Keep going",
  Wednesday: "Halfway there"
};

/* FUNCTIONS */
function loadDailyQuote() {
  const i = new Date().getDate() % dailyQuotes.length;
  document.getElementById("dailyQuote").textContent = dailyQuotes[i];
}

function updateStreak() {
  let streak = Number(localStorage.getItem("streak") || 0);
  let last = localStorage.getItem("last");

  const today = new Date().toDateString();

  if (last !== today) {
    streak++;
    localStorage.setItem("streak", streak);
    localStorage.setItem("last", today);
  }

  document.getElementById("streak").textContent = "Streak: " + streak;
}

function renderCards(mood) {
  const el = document.getElementById("cards");
  el.innerHTML = "";

  content[mood].forEach(item => {
    const div = document.createElement("div");
    div.className = "card";
    div.textContent = item;
    el.appendChild(div);
  });
}

/* EVENTS */
document.querySelectorAll(".mood").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mood").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    const mood = btn.dataset.mood;
    localStorage.setItem("mood", mood);
    renderCards(mood);
  });
});

document.querySelectorAll(".day").forEach(btn => {
  btn.addEventListener("click", () => {
    document.getElementById("dayQuote").textContent =
      dayQuotes[btn.dataset.day];
  });
});

/* INIT */
loadDailyQuote();
updateStreak();

const saved = localStorage.getItem("mood");
if (saved && content[saved]) {
  renderCards(saved);
}

</script>

</body>
</html>
