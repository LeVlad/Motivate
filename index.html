<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Motivate 2.0</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/images/favicon/favicon-16x16.png"/>

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #0f0f1a;
  color: white;
}

/* HERO */
.hero {
  height: 60vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(270deg, #4facfe, #00f2fe, #7f00ff);
  background-size: 600% 600%;
  animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove {
  0% {background-position:0%}
  50% {background-position:100%}
  100% {background-position:0%}
}

.hero h1 {
  font-size: 3rem;
}

/* BUTTON GRID */
.game_area {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 15px;
  padding: 30px;
  max-width: 800px;
  margin: auto;
}

.btn {
  padding: 15px;
  border-radius: 15px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  background: #00f2fe;
  color: black;
  transform: scale(1.05);
}

/* QUOTE BOX */
.quote_box {
  text-align: center;
  margin: 20px auto;
  padding: 20px;
  max-width: 600px;
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
}

.random_quote {
  font-size: 1.3rem;
  font-weight: 600;
}

/* DESCRIPTION */
.description {
  text-align: center;
  max-width: 600px;
  margin: auto;
  opacity: 0.8;
}

/* FOOTER */
footer {
  text-align: center;
  margin-top: 40px;
  opacity: 0.6;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1>Motivate 2.0</h1>
  <p>Choose your day. Get your mindset right.</p>
</section>

<!-- ORIGINAL BUTTON SYSTEM (UNCHANGED) -->
<section class="game_area">
    <button data-day="Monday" class="btn">☕ Monday</button>
    <button data-day="Tuesday" class="btn">💻 Tuesday</button>
    <button data-day="Wednesday" class="btn">🏢 Wednesday</button>
    <button data-day="Thursday" class="btn">🌐 Thursday</button>
    <button data-day="Friday" class="btn">💻 Friday</button>
    <button data-day="Saturday" class="btn">🍷 Saturday</button>
    <button data-day="Sunday" class="btn">🍺 Sunday</button>
</section>

<!-- DESCRIPTION -->
<article class="description">
  <h2>Instructions</h2>
  <p id="instructions">
    Select a day and reveal a message to improve your mindset.
  </p>
</article>

<!-- IMPORTANT: KEEP THIS CLASS EXACTLY -->
<aside class="quote_box">
  <p class="random_quote"></p>
</aside>

<!-- Scripts (UNCHANGED LOGIC) -->
<script src="https://kit.fontawesome.com/394a00d2fc.js" crossorigin="anonymous"></script>
<script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- YOUR ORIGINAL JS -->
<script src="assets/js/script.js"></script>

</body>
</html>
