<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Motivate 2.0</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #0f0f1a;
  color: white;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(270deg, #4facfe, #00f2fe, #7f00ff);
  background-size: 600% 600%;
  animation: gradientMove 10s ease infinite;
  text-align: center;
}

@keyframes gradientMove {
  0% {background-position:0%}
  50% {background-position:100%}
  100% {background-position:0%}
}

.hero h1 {
  font-size: 3rem;
}

.hero button {
  padding: 12px 24px;
  margin-top: 20px;
  border: none;
  border-radius: 30px;
  background: white;
  color: black;
  cursor: pointer;
}

.hero button:active {
  transform: scale(0.95);
}

/* SECTION TITLE */
.section-title {
  text-align: center;
  margin-top: 40px;
  font-size: 1.8rem;
}

/* MOODS */
.moods {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 20px;
}

.mood {
  padding: 20px;
  border-radius: 15px;
  background: rgba(255,255,255,0.05);
  cursor: pointer;
}

.mood.active {
  background: #00f2fe;
  color: black;
  transform: scale(1.05);
}

/* DAY SELECTOR */
.days {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 20px;
}

.day-btn {
  padding: 10px 15px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  background: rgba(255,255,255,0.1);
  color: white;
}

.day-btn:hover {
  background: #7f00ff;
}

/* DAILY */
.daily {
  text-align: center;
  background: rgba(255,255,255,0.05);
  margin: 30px auto;
  padding: 25px;
  border-radius: 20px;
  max-width: 600px;
}

#quote {
  font-size: 1.3rem;
  font-weight: 600;
}

.streak {
  color: #00f2fe;
  margin-top: 10px;
}

/* CARDS */
.cards {
  display: flex;
  overflow-x: auto;
  gap: 20px;
  padding: 20px;
  scroll-snap-type: x mandatory;
}

.card {
  min-width: 250px;
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
  padding: 15px;
  cursor: pointer;
  position: relative;
  scroll-snap-align: start;
}

.card:hover {
  transform: translateY(-10px);
}

.card::after {
  content: "▶";
  position: absolute;
  right: 15px;
  bottom: 15px;
  opacity: 0.6;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  opacity: 0.6;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1>Motivate 2.0</h1>
  <p>Focus your mind. Control your day.</p>
  <button onclick="scrollToSection()">Start</button>
</section>

<!-- MOODS -->
<h2 class="section-title">Choose Your Mood</h2>
<section class="moods" id="moods">
  <div class="mood" onclick="selectMood(event,'focus')">🔥 Focus</div>
  <div class="mood" onclick="selectMood(event,'calm')">😌 Calm</div>
  <div class="mood" onclick="selectMood(event,'confidence')">💪 Confidence</div>
</section>

<!-- DAYS -->
<h2 class="section-title">Pick Your Day</h2>
<section class="days">
  <button class="day-btn" onclick="getDayQuote('Monday')">Monday</button>
  <button class="day-btn" onclick="getDayQuote('Tuesday')">Tuesday</button>
  <button class="day-btn" onclick="getDayQuote('Wednesday')">Wednesday</button>
  <button class="day-btn" onclick="getDayQuote('Thursday')">Thursday</button>
  <button class="day-btn" onclick="getDayQuote('Friday')">Friday</button>
  <button class="day-btn" onclick="getDayQuote('Saturday')">Saturday</button>
  <button class="day-btn" onclick="getDayQuote('Sunday')">Sunday</button>
</section>

<!-- DAILY -->
<section class="daily">
  <h2>Today's Motivation</h2>
  <p id="quote"></p>
  <p class="streak" id="streak"></p>
</section>

<!-- CONTENT -->
<section class="cards" id="cards"></section>

<!-- FOOTER -->
<footer>
  <p>&copy; 2026 Motivate.me</p>
</footer>

<script>

/* SCROLL */
function scrollToSection() {
  document.getElementById('moods').scrollIntoView({behavior: 'smooth'});
}

/* CONTENT */
const content = {
  focus: ["Deep Work", "No Distractions", "Study Discipline"],
  calm: ["Let Go", "Peaceful Mind", "Reset"],
  confidence: ["Believe", "Win Today", "No Fear"]
};

/* SELECT MOOD */
function selectMood(event, mood) {
  document.querySelectorAll('.mood').forEach(m => m.classList.remove('active'));
  event.target.classList.add('active');

  const container = document.getElementById('cards');
  container.innerHTML = "";

  content[mood].forEach(item => {
    const div = document.createElement('div');
    div.className = "card";
    div.innerHTML = `<h3>${item}</h3><p>2 min watch</p>`;
    container.appendChild(div);
  });

  localStorage.setItem("lastMood", mood);
}

/* DAY QUOTES */
const dayQuotes = {
  Monday: "Start strong. Set the tone.",
  Tuesday: "Build momentum.",
  Wednesday: "Push through the middle.",
  Thursday: "Almost there. Stay sharp.",
  Friday: "Finish strong.",
  Saturday: "Recharge and grow.",
  Sunday: "Reflect and prepare."
};

function getDayQuote(day) {
  document.getElementById('quote').innerText = dayQuotes[day];
}

/* DAILY RANDOM */
const quotes = [
  "Push yourself.",
  "Small steps daily.",
  "Discipline wins.",
  "Stay consistent."
];

function loadQuote() {
  const today = new Date().getDate();
  document.getElementById('quote').innerText = quotes[today % quotes.length];
}

/* STREAK */
function updateStreak() {
  let streak = localStorage.getItem("streak") || 0;
  let lastVisit = localStorage.getItem("lastVisit");

  const today = new Date().toDateString();

  if (lastVisit !== today) {
    streak++;
    localStorage.setItem("streak", streak);
    localStorage.setItem("lastVisit", today);
  }

  document.getElementById("streak").innerText = "🔥 Streak: " + streak + " days";
}

/* INIT */
loadQuote();
updateStreak();

const lastMood = localStorage.getItem("lastMood");
if (lastMood) {
  selectMood({target: document.querySelector(`[onclick*="${lastMood}"]`)}, lastMood);
}

</script>

</body>
</html>
